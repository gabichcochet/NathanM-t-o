<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Inscription</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-100 to-sky-100 flex items-center justify-center p-6">
  <main class="w-full max-w-md">
    <section class="bg-white/90 backdrop-blur shadow-2xl rounded-2xl p-8">
      <header class="text-center mb-6">
        <h1 class="text-2xl font-semibold">Créer un compte</h1>
        <p class="text-sm text-slate-500">Inscrivez-vous pour accéder à la station météo</p>
      </header>

      <form id="signupForm" novalidate class="space-y-4">
        <div>
          <label for="name" class="block text-sm font-medium text-slate-700">Nom complet</label>
          <input id="name" name="name" type="text" required
            class="mt-1 block w-full rounded-lg border border-slate-200 px-4 py-2 focus:outline-none focus:ring-2 focus:ring-sky-300" />
          <p id="nameHelp" class="mt-1 text-xs text-red-600 hidden"></p>
        </div>

        <div>
          <label for="email" class="block text-sm font-medium text-slate-700">Adresse e-mail</label>
          <input id="email" name="email" type="email" required
            class="mt-1 block w-full rounded-lg border border-slate-200 px-4 py-2 focus:outline-none focus:ring-2 focus:ring-sky-300" />
          <p id="emailHelp" class="mt-1 text-xs text-red-600 hidden"></p>
        </div>

        <div>
          <label for="password" class="block text-sm font-medium text-slate-700">Mot de passe</label>
          <input id="password" name="password" type="password" required minlength="6"
            class="mt-1 block w-full rounded-lg border border-slate-200 px-4 py-2 focus:outline-none focus:ring-2 focus:ring-sky-300" />
          <p id="passwordHelp" class="mt-1 text-xs text-red-600 hidden"></p>
        </div>

        <div>
          <label for="pairCode" class="block text-sm font-medium text-slate-700">Code d’appairage (optionnel)</label>
          <input id="pairCode" name="pairCode" type="text"
            class="mt-1 block w-full rounded-lg border border-slate-200 px-4 py-2 focus:outline-none focus:ring-2 focus:ring-sky-300" />
        </div>

        <div>
          <button type="submit" class="w-full py-2 rounded-lg bg-sky-600 text-white font-medium hover:bg-sky-700 focus:outline-none focus:ring-2 focus:ring-sky-300">S'inscrire</button>
        </div>

        <div class="text-center text-sm text-slate-500">
          Déjà un compte ? <a href="connexion.html" class="text-sky-600 hover:underline">Connectez-vous</a>
        </div>
      </form>
    </section>
  </main>

  <script>
    const form = document.getElementById('signupForm');
    const name = document.getElementById('name');
    const email = document.getElementById('email');
    const pwd = document.getElementById('password');
    const pairCode = document.getElementById('pairCode');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const newUser = {
        name: name.value.trim(),
        email: email.value.trim(),
        password: pwd.value.trim(),
        devices: []
      };

      if (pairCode.value.trim()) {
        newUser.devices.push(pairCode.value.trim());
      }

      try {
        const response = await fetch("/api/signup", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(newUser)
        });

        const data = await response.json();

        if (!response.ok || data.error) {
          alert("Erreur lors de l'inscription : " + (data.error || "inconnue"));
          return;
        }

        localStorage.setItem("currentUser", JSON.stringify(data));
        alert("Utilisateur enregistré !");
        window.location.href = "station.html";
      } catch (err) {
        console.error("Erreur API:", err);
        alert("Impossible de contacter le serveur.");
      }
    });
  </script>
</body>
</html>
