<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Station</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
    <header>
        <h1>🌡️ Température</h1>
    </header>

    <section class="cards">
        <div class="card">
            <h2 id="temperature">-- °C</h2>
            <p>Température</p>
        </div>
        <div class="card">
            <h2 id="humidity">-- %</h2>
            <p>Humidité</p>
        </div>
    </section>

    <section>
        <canvas id="chartTemp" width="400" height="150"></canvas>
    </section>

    <script src="script.js"></script>
</body>
</html>
