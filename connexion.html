<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Connexion</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-100 to-sky-100 flex items-center justify-center p-6">
  <main class="w-full max-w-md">
    <section class="bg-white/90 backdrop-blur shadow-2xl rounded-2xl p-8">
      <header class="text-center mb-6">
        <h1 class="text-2xl font-semibold">Bienvenue</h1>
        <p class="text-sm text-slate-500">Connectez-vous à votre compte</p>
      </header>

      <form id="loginForm" novalidate class="space-y-4">
        <div>
          <label for="email" class="block text-sm font-medium text-slate-700">Adresse e-mail</label>
          <input id="email" name="email" type="email" required
            class="mt-1 block w-full rounded-lg border border-slate-200 px-4 py-2 focus:outline-none focus:ring-2 focus:ring-sky-300" />
          <p id="emailHelp" class="mt-1 text-xs text-red-600 hidden"></p>
        </div>

        <div>
          <label for="password" class="block text-sm font-medium text-slate-700">Mot de passe</label>
          <input id="password" name="password" type="password" required minlength="6"
            class="mt-1 block w-full rounded-lg border border-slate-200 px-4 py-2 focus:outline-none focus:ring-2 focus:ring-sky-300" />
          <p id="passwordHelp" class="mt-1 text-xs text-red-600 hidden"></p>
        </div>

        <div>
          <button type="submit" class="w-full py-2 rounded-lg bg-sky-600 text-white font-medium hover:bg-sky-700 focus:outline-none focus:ring-2 focus:ring-sky-300">Se connecter</button>
        </div>
      </form>

      <footer class="mt-6 text-center text-sm text-slate-600">
        Pas encore de compte ? 
        <a href="inscrire.html" class="text-sky-600 hover:underline">Inscrivez-vous</a>
      </footer>
    </section>
  </main>

  <script>
    const form = document.getElementById('loginForm');
    const email = document.getElementById('email');
    const pwd = document.getElementById('password');
    const emailHelp = document.getElementById('emailHelp');
    const passwordHelp = document.getElementById('passwordHelp');

    function showError(el, msg) {
      el.textContent = msg;
      el.classList.remove('hidden');
    }
    function hideError(el) {
      el.textContent = '';
      el.classList.add('hidden');
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      let ok = true;

      const emailVal = email.value.trim();
      const pwdVal = pwd.value.trim();

      if (!emailVal) {
        showError(emailHelp, "L'adresse e-mail est requise.");
        ok = false;
      } else hideError(emailHelp);

      if (!pwdVal) {
        showError(passwordHelp, "Le mot de passe est requis.");
        ok = false;
      } else if (pwdVal.length < 6) {
        showError(passwordHelp, "Le mot de passe doit contenir au moins 6 caractères.");
        ok = false;
      } else hideError(passwordHelp);

      if (!ok) return;

      const users = JSON.parse(localStorage.getItem("users")) || [];
      const foundUser = users.find(u => u.email === emailVal && u.password === pwdVal);

      if (foundUser) {
        localStorage.setItem("currentUser", JSON.stringify(foundUser));
        alert("Connexion réussie !");
        window.location.href = "station.html";
      } else {
        showError(passwordHelp, "Email ou mot de passe incorrect.");
      }
    });
  </script>
</body>
</html>
